# Render's free plan puts the backend to sleep after 15 minutes without visitors, and waking it takes
# minutes. Visiting it every 10 minutes keeps it awake. Free for public repositories.
#
# GitHub pauses scheduled jobs in repositories with no activity for 60 days, and can run them a few
# minutes late when busy. "Run workflow" on the Actions tab starts it by hand.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Set a repository variable called BACKEND_URL to use a different address.
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://where-is-my-bus-pos8.onrender.com' }}
    steps:
      - name: Visit the backend
        # A slow answer just means it was asleep and is now waking, which is the point.
        run: curl -sS --max-time 240 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$BACKEND_URL/api/feeds" || echo "Still waking up"
