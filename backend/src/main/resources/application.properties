# Hosting services say which port to use through PORT.
server.port=${PORT:8080}

# Downloaded feeds are cached here so restarts don't re-download them.
wimb.data-dir=./data
wimb.refresh-after-hours=24
# Any site may call the API. It has no logins or cookies, so this exposes nothing private.
wimb.allowed-origins=${WIMB_ALLOWED_ORIGINS:*}
# Optional. A free key from https://opencellid.org makes towers known before riders have mapped them.
wimb.opencellid.key=${OPENCELLID_KEY:}

# Any GTFS zip can be added here; nothing else in the app is specific to a region.
# Feeds load in index order and feed 0 is the app's default.

wimb.feeds[0].id=mumbai
wimb.feeds[0].name=Mumbai, Thane & Kalyan
wimb.feeds[0].region=Maharashtra
wimb.feeds[0].operators=BEST, TMT, KDMT, VVMT
wimb.feeds[0].url=https://raw.githubusercontent.com/croyla/mumbai-gtfs/main/gtfs_compat.zip
wimb.feeds[0].source=Community feed by BLRTransit
wimb.feeds[0].source-url=https://github.com/croyla/mumbai-gtfs
wimb.feeds[0].official=false
wimb.feeds[0].number-rule=ROUTE_NAME
# Measured from the feed: BEST trips average 34 km/h, against 13 km/h for TMT in the same feed.
wimb.feeds[0].note=BEST times in this feed look too fast for city traffic, so real journeys may take longer.

wimb.feeds[1].id=pune
wimb.feeds[1].name=Pune & Pimpri-Chinchwad
wimb.feeds[1].region=Maharashtra
wimb.feeds[1].operators=PMPML
# Not the "compat" file: that merges directions, so its route IDs don't match the live feed's.
wimb.feeds[1].url=https://raw.githubusercontent.com/croyla/pmpml-gtfs/main/pmpml_gtfs.zip
# Positions from GPS devices on the buses, published by the same author. They say it isn't
# exhaustive and that this address may change.
wimb.feeds[1].realtime-url=https://rt-bucket.blrtransit.com/rt/feed/rt.pb
wimb.feeds[1].source=Community feed by BLRTransit
wimb.feeds[1].source-url=https://github.com/croyla/pmpml-gtfs
wimb.feeds[1].official=false
wimb.feeds[1].number-rule=ROUTE_NAME

wimb.feeds[2].id=msrtc
wimb.feeds[2].name=Maharashtra ST
wimb.feeds[2].region=Maharashtra
wimb.feeds[2].operators=MSRTC
wimb.feeds[2].url=https://raw.githubusercontent.com/croyla/msrtc-gtfs/main/gtfs.zip
wimb.feeds[2].source=Unofficial community feed (no licence stated)
wimb.feeds[2].source-url=https://github.com/croyla/msrtc-gtfs
wimb.feeds[2].official=false
wimb.feeds[2].number-rule=ROUTE_NAME
wimb.feeds[2].numbers-are-codes=true
# State buses run between cities, and a city like Sambhaji Nagar has several stands kilometres apart.
# A bus to any stand within this distance of the one picked counts as going there.
wimb.feeds[2].stop-radius-km=8
# Stated in the feed's own README.
wimb.feeds[2].note=This feed is incomplete, so some buses and days may be missing. Route numbers are internal codes, so search by place name.

wimb.feeds[3].id=telangana
wimb.feeds[3].name=Telangana
wimb.feeds[3].region=Telangana
wimb.feeds[3].operators=TGSRTC
wimb.feeds[3].url=https://data.opencity.in/dataset/88e2d145-7ec6-4666-88dd-6cf18b18312e/resource/1b0d18bb-b2fb-4a79-8ed0-1e071da5790c/download/telangana_opendata_gtfs_tgsrtc_08_february_2026.zip
wimb.feeds[3].source=Open Data Telangana, hosted by OpenCity
wimb.feeds[3].source-url=https://data.telangana.gov.in/
wimb.feeds[3].official=true
wimb.feeds[3].number-rule=TRIP_NAME_PREFIX
