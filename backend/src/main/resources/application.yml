server:
  # Hosting services say which port to use through PORT.
  port: ${PORT:8080}

wimb:
  # Downloaded feeds are cached here so restarts don't re-download them.
  data-dir: ./data
  refresh-after-hours: 24
  # Any site may call the API. It has no logins or cookies, so this exposes nothing private.
  allowed-origins: ${WIMB_ALLOWED_ORIGINS:*}
  opencellid:
    # Optional. A free key from https://opencellid.org makes towers known before riders have mapped them.
    key: ${OPENCELLID_KEY:}
  # Any GTFS zip can be added here; nothing else in the app is specific to a region.
  # Feeds load in this order and the first one is the app's default.
  feeds:
    - id: mumbai
      name: Mumbai, Thane & Kalyan
      region: Maharashtra
      operators: BEST, TMT, KDMT, VVMT
      url: https://raw.githubusercontent.com/croyla/mumbai-gtfs/main/gtfs_compat.zip
      source: Community feed by BLRTransit
      source-url: https://github.com/croyla/mumbai-gtfs
      official: false
      number-rule: ROUTE_NAME
      # Measured from the feed: BEST trips average 34 km/h, against 13 km/h for TMT in the same feed.
      note: BEST times in this feed look too fast for city traffic, so real journeys may take longer.
    - id: pune
      name: Pune & Pimpri-Chinchwad
      region: Maharashtra
      operators: PMPML
      # Not the "compat" file: that merges directions, so its route IDs don't match the live feed's.
      url: https://raw.githubusercontent.com/croyla/pmpml-gtfs/main/pmpml_gtfs.zip
      # Positions from GPS devices on the buses, published by the same author. They say it isn't
      # exhaustive and that this address may change.
      realtime-url: https://rt-bucket.blrtransit.com/rt/feed/rt.pb
      source: Community feed by BLRTransit
      source-url: https://github.com/croyla/pmpml-gtfs
      official: false
      number-rule: ROUTE_NAME
    - id: msrtc
      name: Maharashtra ST
      region: Maharashtra
      operators: MSRTC
      url: https://raw.githubusercontent.com/croyla/msrtc-gtfs/main/gtfs.zip
      source: Unofficial community feed (no licence stated)
      source-url: https://github.com/croyla/msrtc-gtfs
      official: false
      number-rule: ROUTE_NAME
      numbers-are-codes: true
      # Stated in the feed's own README.
      note: This feed is incomplete, so some buses and days may be missing. Route numbers are internal codes, so search by place name.
    - id: telangana
      name: Telangana
      region: Telangana
      operators: TGSRTC
      url: https://data.opencity.in/dataset/88e2d145-7ec6-4666-88dd-6cf18b18312e/resource/1b0d18bb-b2fb-4a79-8ed0-1e071da5790c/download/telangana_opendata_gtfs_tgsrtc_08_february_2026.zip
      source: Open Data Telangana, hosted by OpenCity
      source-url: https://data.telangana.gov.in/
      official: true
      number-rule: TRIP_NAME_PREFIX
    - id: delhi
      name: Delhi
      region: Delhi
      operators: DTC, DIMTS
      url: https://files.mobilitydatabase.org/mdb-1262/mdb-1262-202506170152/mdb-1262-202506170152.zip
      source: Delhi Open Transit Data, copy from Mobility Database
      source-url: https://otd.delhi.gov.in/
      official: true
      number-rule: ROUTE_NAME
      # Stated in the portal's own documentation.
      note: Delhi's published times are rough estimates that assume a constant speed.
